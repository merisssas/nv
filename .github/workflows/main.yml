name: Replace module path mampirmasss/B -> merisssas/nv

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: replace-module-path
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure ripgrep
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ripgrep
          fi

      - name: Replace all occurrences
        shell: bash
        run: |
          set -euo pipefail

          FROM='github.com/mampirmasss/B'
          TO='github.com/merisssas/nv'

          echo "Searching occurrences of: $FROM"

          # Kumpulkan file yang mengandung FROM, output NUL-separated (aman untuk spasi/newline)
          rg -l -0 --hidden --no-mmap \
            --glob '!.git/**' \
            --glob '!vendor/**' \
            --glob '!node_modules/**' \
            --glob '!**/*.png' --glob '!**/*.jpg' --glob '!**/*.jpeg' --glob '!**/*.gif' --glob '!**/*.webp' \
            --glob '!**/*.zip' --glob '!**/*.gz'  --glob '!**/*.tgz'  --glob '!**/*.7z'  --glob '!**/*.pdf' \
            "$FROM" . > /tmp/matches || true

          if [ ! -s /tmp/matches ]; then
            echo "No matches found. Nothing to do."
            exit 0
          fi

          echo "Replacing in files:"
          tr '\0' '\n' < /tmp/matches

          # Pakai delimiter '|' agar aman dari '/' dalam FROM/TO.
          # \Q...\E memastikan FROM diperlakukan literal.
          # (TO tidak perlu \Q karena kita tidak mem-parsingnya sebagai regex, hanya replacement string.)
          xargs -0 -a /tmp/matches perl -0777 -i -pe "s|\Q$FROM\E|$TO|g"

      - name: Show diff
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain
          git --no-pager diff

      - name: Commit & push if changed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore: replace module path mampirmasss/B -> merisssas/nv"
          git push
